name = "smart21store"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Serves smart21store.html, icons, manifest and service worker.
# The Worker runs first for /api/* and for the store page + SEO routes (/item/*),
# so it can add canonical links and structured data. Everything else is served straight from ./public.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/", "/smart21store", "/smart21store.html", "/robots.txt", "/sitemap.xml", "/item/*"]

[[d1_databases]]
binding = "DB"
database_name = "smart21store-db"
database_id = "be86655d-695d-405a-b4d7-2ff81ddc18bb"

[[r2_buckets]]
binding = "MATERIALS"
bucket_name = "smart21store-files"

# SEO: your public address (no trailing slash). Used for canonical links, sitemap and social tags.
[vars]
SITE_URL = "https://smart21store.smart21brain.com"
# One sign-in for Smart21Brain and the store: share the session cookie across *.smart21brain.com.
# Set the SAME value in Smart21Brain's wrangler.toml and use the updated src/lib/auth.js there too.
COOKIE_DOMAIN = ".smart21brain.com"
# Google sign-in: OAuth Web client ID from Google Cloud Console (public value, not a secret)
# GOOGLE_CLIENT_ID = "1234567890-abc.apps.googleusercontent.com"
# GOOGLE_SITE_VERIFICATION = "paste-token-from-search-console"

[ai]
binding = "AI"

# Optional, once the domain is on Cloudflare:
# routes = [{ pattern = "yourdomain.com/api/store/*", zone_name = "yourdomain.com" }]
