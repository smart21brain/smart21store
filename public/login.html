<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Smart21Store</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1712;color:#e8f1ec;font:16px/1.4 Poppins,'Segoe UI',Roboto,sans-serif;padding:16px}
.c{width:100%;max-width:380px;background:#14221b;border:1px solid #23372c;border-radius:20px;padding:28px}
h1{margin:0 0 4px;font-size:22px}h1 b{color:#ffc857}p{margin:0 0 18px;color:#9db3a6;font-size:14px}
label{display:block;font-size:13px;color:#9db3a6;margin:12px 0 4px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #2b4436;background:#0f1a14;color:#e8f1ec;font:inherit}
input:focus{outline:2px solid #0B6E4F}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:99px;background:#ffc857;color:#2b2100;font:600 15px inherit;cursor:pointer}
button:disabled{opacity:.6}#e{color:#ff8a80;font-size:14px;min-height:20px;margin-top:10px}a{color:#8be3b8;font-size:14px}
</style></head><body><form class="c" id="f"><h1>Smart21<b>Store</b></h1><p>Sign in with your Smart21Brain account.</p>
<label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
<div id="e" role="alert"></div><button id="b">Sign in</button><p style="margin-top:16px"><a href="/">Back to the store</a></p></form>
<script>
var n=new URLSearchParams(location.search).get('next')||'/';if(n[0]!=='/'||n[1]==='/'||/[\\:]/.test(n))n='/';
document.getElementById('f').onsubmit=function(ev){ev.preventDefault();var b=document.getElementById('b'),e=document.getElementById('e');b.disabled=true;e.textContent='';
fetch('/api/store/login',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({email:document.getElementById('em').value,password:document.getElementById('pw').value})})
.then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})}).then(function(){location.href=n}).catch(function(j){e.textContent=(j&&j.error)||'Could not sign in. Try again.';b.disabled=false})};
</script></body></html>
