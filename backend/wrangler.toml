name = "smart21store"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Serves smart21store.html, icons, manifest and service worker.
# Only /api/* runs through the Worker code.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "smart21store-db"
database_id = "PASTE-ID-FROM-wrangler-d1-create"

[[r2_buckets]]
binding = "MATERIALS"
bucket_name = "smart21store-files"

[ai]
binding = "AI"

# Optional, once the domain is on Cloudflare:
# routes = [{ pattern = "yourdomain.com/api/store/*", zone_name = "yourdomain.com" }]
